services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split"]
      interval: 2s
      retries: 15

  # Optional: start with `docker compose --profile kafka up -d` and run the
  # API with KAFKA_BROKERS=localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [kafka]
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
