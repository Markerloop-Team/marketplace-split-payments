run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - misspell
    - nolintlint
    - unconvert
    - unparam
    - usestdlibvars

linters-settings:
  goimports:
    local-prefixes: github.com/markerloop/marketplace-split-payments
  gocritic:
    enabled-tags: [diagnostic, performance]
    disabled-checks: [hugeParam, rangeValCopy]

issues:
  exclude-rules:
    - path: _test\.go
      linters: [unparam]
